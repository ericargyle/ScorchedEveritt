name: Test, deploy and package
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
  windows:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publish portable executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-FileHash release/ScorchedEveritt-Windows-11-x64.exe -Algorithm SHA256 | Format-List | Out-File release/SHA256.txt
          gh release create $env:GITHUB_REF_NAME release/ScorchedEveritt-Windows-11-x64.exe release/SHA256.txt --title "ScorchedEveritt $env:GITHUB_REF_NAME" --notes "Portable Windows x64 build. Download and run the EXE; no install required. Unsigned community build: Windows SmartScreen may warn. Original team: Suneil Hosmane, Terrence Janas, Yajur Parikh. Modern recreation from their ECE291 Spring 2001 design document. Play online: https://ericargyle.github.io/ScorchedEveritt/"
